<!-- heading content-->
{% load static %}
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


<title>My Blog</title>


<link rel="stylesheet" href="{% static 'css/blog.css' %}">


</head>

<body>


<!-- Main Container -->
<main class="container">
    <!-- Header -->

    <div class="nav">
       <h2>BLOG APP</h2>
           <!-- search field -->
            
            <!-- Search -->
            <div class="card mb-4">

                <div class="card-body">

                    <form method="GET" action="{% url 'search'%}">

                        <div class="input-group">

                            <input class="form-control" type="text" value="{{keyword|default:''}}" name="keyword" placeholder="Enter search term...">
                            

                            <button class="btn btn-warning"type="submit">
                            
                                Go!
                            </button>

                        </div>

                    </form>

                </div>

            </div>

            <div class="buttons">
        {% if not user.is_authenticated %}    
        <a href="{% url 'login' %}">
            <button class="btn btn-warning">Login</button>
        </a>
        <a href="{% url 'register' %}">
            <button class="btn btn-warning">Register</button>
        </a>
        {% else %}
        <span>logined as {{user}}</span>
        <a href="{% url 'logout'%}">
            <button class="btn btn-warning">Logout</button>
        </a>
        {% endif %}
        </div>


</div>

<!-- Horizontal Line -->

<hr>

<!-- Topics -->
<div class="topics">
            {% for topic in  categories %}
               <a href="{% url 'category_pages' topic.id%}" style="margin:40px">{{topic.category_name}}</a>
            
            {% endfor %}
</div>   
        
    
<!-- body content -->
 {% block content %}

 {% endblock %}

<!-- footer content -->


<footer>

    <p>
        Blog built with ♥ by Sireesha
    </p>

</footer>


</body>

</html>
