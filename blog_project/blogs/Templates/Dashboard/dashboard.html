{% extends 'base.html' %}

{% block content %}
<div class ='row'>
    <!-- left side -->
   {% include 'Dashboard/sidebar.html' %}
    <!-- right side -->
     <div class ='col-md-9'>
        <h3>loged in as {{user}}</h3>
        <div class="row">
            <div class ="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All categories</div>
                    <div class="card-body text-dark">
                        <div class ="card-title text-center"> {{context.categories}}</div>
                    </div>
                </div>
            </div>
             <div class ="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All posts</div>
                    <div class="card-body text-dark">
                        <div class ="card-title text-center"> {{context.posts}}</div>
                    </div>
                </div>
            </div>
        </div>


     </div>
        
</div>

{% endblock %}
