{% extends 'base.html' %}

{% block content%}

<div class="row flex-col">
    {% include 'Dashboard/sidebar.html' %}
    
    <div class="col-md-9">
        <h3>All categories</h3>
        <a href=" {% url 'add_categories' %}"> <button class="btn btn-warning float-left">add</button> </a>
        <table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">Sno.</th>
      <th scope="col">Categories</th>
      <th scope="col">created at</th>
      <th scope="col">Updated at</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for cat in categories %}
    
    <tr>
      <th scope="row">{{cat.id}}</th>
      <td>{{cat}}</td>
      <td>{{cat.created_at}}</td>
      <td>{{cat.updated_at}}</td>
      <td>
        <a href="{% url 'edit_category' cat.id %}"><i class="fa fa-pen text-success "></i></a>
        &nbsp
        <a href="{% url 'delete_category' cat.id %}"><i class="fa fa-trash text-danger "></i></a>
      </td>
    </tr>
    {% endfor %}
   
    
  </tbody>
</table>
    </div>

</div>


{% endblock%}
